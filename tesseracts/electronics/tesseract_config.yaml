name: electronics
version: "0.2.0"
description: |
  Control-electronics line for superconducting-qubit XY drive: DAC zero-order
  hold, baseband line response (biquad SOS cascade), IQ mixer imbalance and LO
  leakage, Rapp amplifier compression on the complex envelope magnitude, drive
  scaling.

  The numerical core is a Julia module. There is no automatic-differentiation
  package anywhere in this image -- the jacobian_vector_product and
  vector_jacobian_product endpoints are derived analytically by hand. That places
  a boundary of both LANGUAGE and DIFFERENTIATION STRATEGY between this Tesseract
  and the JAX transmon Tesseract it composes with, and it is a boundary
  jax.custom_vjp cannot cross.

  The measured line response is an input of variable section count, so one image
  covers instruments with different numbers of biquad sections. What the image
  pins is the code and its hand-derived adjoint, not one fridge's calibration.

build_config:
  target_platform: "native"

  extra_packages:
    - curl
    - ca-certificates

  package_data:
    - ["julia/Project.toml", "julia/Project.toml"]
    # Manifest is committed and copied in so the image resolves to exactly the
    # package versions this was developed and verified against.
    - ["julia/Manifest.toml", "julia/Manifest.toml"]
    - ["julia/src/LineChain.jl", "julia/src/LineChain.jl"]

  custom_build_steps:
    # Julia toolchain, pinned to the version used during development, with the
    # download selected from the BUILD ARCHITECTURE rather than hardcoded.
    # target_platform is "native", so this image is arm64 on Apple silicon and
    # amd64 on an x86 host -- and a hardcoded aarch64 tarball would make the
    # build fail outright for any reviewer on x86.
    - |
      RUN set -eu; \
          case "$(uname -m)" in \
            aarch64|arm64) JDIR=aarch64; JTAG=aarch64 ;; \
            x86_64|amd64)  JDIR=x64;     JTAG=x86_64  ;; \
            *) echo "unsupported build architecture: $(uname -m)" >&2; exit 1 ;; \
          esac; \
          curl -fsSL "https://julialang-s3.julialang.org/bin/linux/${JDIR}/1.12/julia-1.12.6-linux-${JTAG}.tar.gz" \
            -o /tmp/julia.tar.gz && \
          mkdir -p /opt/julia && \
          tar -xzf /tmp/julia.tar.gz -C /opt/julia --strip-components=1 && \
          rm /tmp/julia.tar.gz && \
          /opt/julia/bin/julia --version

    # Resolve and precompile into an image layer so serve-time is a load, not a
    # compile. The depot must be world-writable: the runtime is not root.
    - |
      RUN JULIA_DEPOT_PATH=/opt/juliadepot \
          /opt/julia/bin/julia --project=/tesseract/julia -e \
            'using Pkg; Pkg.instantiate(); Pkg.precompile()' && \
          chmod -R 777 /opt/juliadepot

    # Guard the central claim: no autodiff framework may enter this image.
    - |
      RUN python -c "import importlib.util,sys; \
          bad=[m for m in ('jax','torch','tensorflow','autograd') if importlib.util.find_spec(m)]; \
          sys.exit('AD framework leaked into the electronics image: %s' % bad) if bad else print('no-AD guard: OK')"

env:
  PYTHON_JULIAPKG_EXE: "/opt/julia/bin/julia"
  PYTHON_JULIAPKG_PROJECT: "/tesseract/julia"
  PYTHON_JULIAPKG_OFFLINE: "yes"
  PYTHON_JULIACALL_EXE: "/opt/julia/bin/julia"
  PYTHON_JULIACALL_PROJECT: "/tesseract/julia"
  JULIA_DEPOT_PATH: "/opt/juliadepot"
  JULIA_NUM_THREADS: "1"
