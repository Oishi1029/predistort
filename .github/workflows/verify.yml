name: verify

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Create the Python environment
        run: make env

      - name: Put the venv on PATH for every later step
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build both Tesseract images
        run: make build

      - name: Verify
        run: make verify
